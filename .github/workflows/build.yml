name: Build Rodin Essential (PT-BR)

on:
  workflow_dispatch:
  push:
    paths:
      - "ui/flutter/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download base APK from the base-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base-apk --repo "$GITHUB_REPOSITORY" --pattern "Rodin-Essential.apk" --dir . --clobber || {
            echo "::error::Nao achei o arquivo Rodin-Essential.apk na release com a tag base-apk"
            exit 1
          }
          ls -la Rodin-Essential.apk

      - name: Install Flutter 3.44.8 (Dart 3.12.2, same as the original APK)
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version
          flutter precache --android

      - name: Compare engine revision with the original APK (informational)
        run: |
          ENGINE="$(tr -d '[:space:]' < "$HOME/flutter/bin/internal/engine.version")"
          echo "SDK engine.version = $ENGINE"
          unzip -oq Rodin-Essential.apk lib/arm64-v8a/libflutter_engine.so -d /tmp/eng
          if strings -n 8 /tmp/eng/lib/arm64-v8a/libflutter_engine.so | grep -q "$ENGINE"; then
            echo "ENGINE_MATCH=yes"
          else
            echo "ENGINE_MATCH=not-found-in-binary (check not conclusive)"
          fi

      - name: Flutter pub get
        working-directory: ui/flutter
        run: flutter pub get

      - name: Build Dart AOT bundle (libapp.so + assets)
        working-directory: ui/flutter
        run: |
          flutter assemble \
            --output="$RUNNER_TEMP/aot" \
            -dTargetPlatform=android-arm64 \
            -dBuildMode=release \
            -dTargetFile=lib/main.dart \
            -dTrackWidgetCreation=false \
            android_aot_bundle_release_android-arm64
          find "$RUNNER_TEMP/aot" -maxdepth 2 | head -30

      - name: Repack original APK with the new AOT bundle
        run: |
          cat > "$RUNNER_TEMP/repack.py" <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED, ZIP_DEFLATED

          base_apk, aot_dir, out_apk = sys.argv[1:4]
          aot = Path(aot_dir)
          new_so = aot / "arm64-v8a" / "app.so"
          new_assets = aot / "flutter_assets"
          assert new_so.is_file(), f"missing {new_so}"
          assert new_assets.is_dir(), f"missing {new_assets}"

          base = ZipFile(base_apk)
          names = {i.filename for i in base.infolist()}
          icu = base.read("assets/icudtl.dat")

          rels = sorted(
              (p.relative_to(aot).as_posix() for p in new_assets.rglob("*") if p.is_file()),
              key=lambda s: s.encode(),
          )
          data = {r: (aot / r).read_bytes() for r in rels}

          lines = "".join(
              f"{hashlib.sha256(data[r]).hexdigest()}  {r}\n" for r in rels
          ) + f"{hashlib.sha256(icu).hexdigest()}  icudtl.dat\n"
          stamp = hashlib.sha256(lines.encode()).hexdigest()
          index = "".join(r[len("flutter_assets/"):] + "\n" for r in rels)

          replace = {"lib/arm64-v8a/libapp.so": new_so.read_bytes(),
                     "assets/flutter_assets.index": index.encode(),
                     "assets/rodin_runtime.stamp": (stamp + "\n").encode()}
          for r in rels:
              replace["assets/" + r] = data[r]

          def zi(name, ctype):
              i = ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
              i.compress_type = ctype
              i.external_attr = 0o644 << 16
              return i

          with ZipFile(out_apk, "w", allowZip64=True) as out:
              for info in base.infolist():
                  n = info.filename
                  if n.startswith("META-INF/"):
                      continue
                  if n.startswith("assets/flutter_assets/") and n not in replace:
                      continue  # stale asset no longer in the new bundle
                  if n in replace:
                      out.writestr(zi(n, info.compress_type), replace[n])
                  else:
                      out.writestr(zi(n, info.compress_type), base.read(n))
              for n, b in replace.items():
                  if n not in names:
                      out.writestr(zi(n, ZIP_DEFLATED), b)
          print("STAMP", stamp)
          print("LIBAPP_BYTES", len(replace["lib/arm64-v8a/libapp.so"]))
          PY
          python3 "$RUNNER_TEMP/repack.py" Rodin-Essential.apk "$RUNNER_TEMP/aot" "$RUNNER_TEMP/unaligned.apk"

      - name: Restore or create signing key
        uses: actions/cache@v4
        with:
          path: ~/rodin-ptbr.jks
          key: rodin-ptbr-keystore-v1

      - name: Align and sign
        run: |
          if [ ! -f "$HOME/rodin-ptbr.jks" ]; then
            keytool -genkeypair -keystore "$HOME/rodin-ptbr.jks" -storetype PKCS12 \
              -storepass rodinptbr -keypass rodinptbr -alias rodin-ptbr \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Rodin Essential PT-BR,O=Local,C=BR"
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unaligned.apk" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          cp "$RUNNER_TEMP/aligned.apk" out/Rodin-Essential-ptbr.apk
          "$BT/apksigner" sign --ks "$HOME/rodin-ptbr.jks" --ks-key-alias rodin-ptbr \
            --ks-pass pass:rodinptbr --key-pass pass:rodinptbr out/Rodin-Essential-ptbr.apk
          "$BT/apksigner" verify --verbose out/Rodin-Essential-ptbr.apk
          "$BT/zipalign" -c -P 16 -v 4 out/Rodin-Essential-ptbr.apk | tail -3
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Rodin-Essential-ptbr
          path: out/Rodin-Essential-ptbr.apk
          if-no-files-found: error
          
